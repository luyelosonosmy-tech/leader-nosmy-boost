<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - LEADER NOSMY BOOST</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  margin:0;
  padding:20px;
  color:#111827;
}

.container{
  max-width:1000px;
  margin:auto;
}

h1{
  background:#111827;
  color:white;
  padding:20px;
  border-radius:12px;
  text-align:center;
}

.card{
  background:white;
  padding:20px;
  margin-top:20px;
  border-radius:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.1);
}

.order{
  border:1px solid #ddd;
  padding:15px;
  margin:12px 0;
  border-radius:10px;
  background:#fafafa;
}

pre{
  white-space:pre-wrap;
  word-break:break-word;
}

button{
  background:#2563eb;
  color:white;
  border:0;
  padding:12px 18px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>👑 LEADER NOSMY BOOST — ADMIN</h1>

<div class="card">

<h2>📋 Commandes</h2>

<button onclick="loadOrders()">🔄 Actualiser</button>

<div id="orders">
Chargement...
</div>

</div>

</div>

<script>

async function loadOrders(){

const container=document.getElementById("orders");

container.innerHTML="Chargement...";

try{

const response=await fetch("/orders.json");

if(!response.ok){
throw new Error("Erreur");
}

const orders=await response.json();

if(!orders.length){

container.innerHTML="<p>✅ Aucune commande pour le moment.</p>";

return;
}

container.innerHTML=orders.map(order=>`

<div class="order">

<strong>🆔 Commande : ${order.id || "—"}</strong>

<p>📌 Type : ${order.type || "—"}</p>

<p>👤 Client : ${order.userId || "—"}</p>

<p>📱 Service : ${order.service || "—"}</p>

<p>🔗 Lien : ${order.link || "—"}</p>

<p>🔢 Quantité : ${order.quantity || "—"}</p>

<p>💰 Montant : ${order.price || order.amount || "—"} FC</p>

<p>📊 Statut : ${order.status || "—"}</p>

<p>📅 Date : ${order.createdAt || "—"}</p>

</div>

`).join("");

}catch(error){

container.innerHTML=
"<p>❌ Impossible de charger les commandes.</p>";

}

}

loadOrders();

</script>

</body>
</html>
