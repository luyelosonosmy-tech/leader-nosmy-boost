  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 8px;
      color: #d1d5db;
    }

    .hero {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      text-align: center;
      padding: 55px 20px;
    }

    .hero h2 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    .hero p {
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn,
    .order {
      display: inline-block;

      text-decoration: none;
      font-weight: bold;
    }

    .btn {
      background: white;
      color: #2563eb;
    }

    .container {
      max-width: 1050px;
      margin: auto;
      padding: 35px 15px;
    }

    .about,
    .contact,
    .social {
      background: white;
      padding: 30px;
      margin-bottom: 35px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    .about h2,
    .contact h2,
    .social h2 {
      color: #2563eb;
      font-size: 27px;
      margin-bottom: 20px;
    }

    .about p {
      line-height: 1.7;
      margin-bottom: 15px;
    }

    .about-contact {
      display: inline-block;
      background: #16a34a;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 10px;
    }

    .title {
      text-align: center;
      font-size: 27px;
      margin-bottom: 25px;
    }

    .category {
      margin-bottom: 35px;
    }

    .category-title {
      background: #111827;
      color: white;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 18px;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card h3 {
      color: #2563eb;
      margin-bottom: 12px;
    }

    .card p {
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .price {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .order {
      background: #2563eb;
      color: white;
    }

    .social-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .social-buttons a {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 8px;
      text-decoration: none;
      color: white;
      font-weight: bold;
    }

    .whatsapp {
      background: #16a34a;
    }

    .facebook {
      background: #1877f2;
    }

    .tiktok {
      background: #111827;
    }

    .instagram {
      background: #e1306c;
    }

    .contact-info {
      line-height: 1.8;
      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
    }

    .submit {
      width: 100%;
      background: #16a34a;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
