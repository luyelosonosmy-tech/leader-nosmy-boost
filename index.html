<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEADER NOSMY BOOST</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
html{scroll-behavior:smooth}
body{background:#f4f6f8;color:#222}

header{
  background:#111827;color:white;padding:15px 20px;
  position:sticky;top:0;z-index:1000
}

.navbar{
  max-width:1100px;margin:auto;display:flex;
  align-items:center;justify-content:space-between
}

.logo{
  color:white;text-decoration:none;font-weight:bold;
  font-size:20px;white-space:nowrap
}

.logo span{color:#60a5fa}

.menu{
  display:flex;gap:18px;list-style:none
}

.menu a{
  color:white;text-decoration:none;font-weight:bold;font-size:14px
}

.menu-button{
  display:none;background:#2563eb;color:white;
  border:0;padding:9px 12px;border-radius:7px;font-size:20px
}

.hero{
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:white;text-align:center;padding:65px 20px
}

.hero-logo{
  display:inline-block;border:2px solid white;
  padding:12px 18px;border-radius:12px;margin-bottom:20px;
  font-size:23px;font-weight:bold
}

.hero h1{font-size:34px;margin-bottom:15px}
.hero p{font-size:17px;line-height:1.6;margin-bottom:25px}

.btn{
  display:inline-block;background:white;color:#2563eb;
  padding:13px 23px;border-radius:8px;
  text-decoration:none;font-weight:bold
}

.container{max-width:1050px;margin:auto;padding:35px 15px}
.section{margin-bottom:35px}

.box{
  background:white;padding:30px;border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.09)
}

.title{
  text-align:center;color:#2563eb;font-size:27px;
  margin-bottom:22px
}

.text{line-height:1.8;text-align:center}

/* POURQUOI */

.reasons{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:18px
}

.reason{
  background:#f9fafb;padding:25px;border-radius:12px;
  text-align:center;border:1px solid #e5e7eb
}

.reason-icon{font-size:38px;margin-bottom:12px}
.reason h3{color:#2563eb;margin-bottom:10px}
.reason p{line-height:1.6}

/* CHIFFRES */

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:18px
}

.stat{
  background:#111827;
  color:white;
  padding:25px 15px;
  border-radius:14px;
  text-align:center
}

.stat-icon{
  font-size:35px;
  margin-bottom:10px
}

.stat-number{
  font-size:30px;
  font-weight:bold;
  color:#60a5fa;
  margin-bottom:8px
}

.stat p{
  font-size:15px;
  line-height:1.5
}

/* SERVICES */

.category{margin-bottom:35px}

.category-title{
  background:#111827;color:white;padding:14px;
  border-radius:10px;text-align:center;margin-bottom:18px
}

.services{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px
}

.card{
  background:white;padding:24px;border-radius:12px;
  text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.08)
}

.card h3{color:#2563eb;margin-bottom:12px}
.card p{line-height:1.5;margin-bottom:15px}

.price{
  font-size:19px;font-weight:bold;margin-bottom:15px
}

.order{
  display:inline-block;background:#2563eb;color:white;
  padding:10px 18px;border-radius:7px;
  text-decoration:none;font-weight:bold
}
